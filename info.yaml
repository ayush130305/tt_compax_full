# Tiny Tapeout project information
project:
  title:        "COMPAX: 64 B compressed memory with allocator"
  author:       "Ayush Jain"
  discord:      ""
  description:  "UART-controlled 64-byte flop memory with lossless BDI block compression and a block allocator that packs compressed blocks into a heap"
  language:     "Verilog"
  clock_hz:     25000000

  tiles: "3x2"

  top_module:  "tt_um_ayush130305_compax"

  source_files:
    - "compax_top.v"
    - "compax_controller.v"
    - "flop_mem.v"
    - "bdi_word_alu.v"
    - "uart_rx.v"
    - "uart_tx.v"

pinout:
  # Inputs
  ui[0]: "UART_RX (host to chip)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "UART_TX (chip to host)"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
